<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flask</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h2>NCIT ko Logo</h2>
    <img src="static/card.png" alt="NCIT Logo" width="80" height="60">
    <img src="{{ url_for('static', filename='card.png') }}" alt="NCIT Logo" height="100" width="120">

    <h3>Send a Message</h3>
    <form method="POST">
        <input type="text" name="message" placeholder="Enter message">
        <button type="submit">Submit</button>
    </form>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <p>{{ msg }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
</body>
