<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | GMI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #2563eb
    );
    position:relative;
}

/* Animated Background Circles */
.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(20px);
    animation:float 8s ease-in-out infinite;
}

.circle:nth-child(1){
    width:300px;
    height:300px;
    background:#3b82f6;
    top:-80px;
    left:-80px;
}

.circle:nth-child(2){
    width:250px;
    height:250px;
    background:#8b5cf6;
    bottom:-60px;
    right:-60px;
    animation-delay:2s;
}

.circle:nth-child(3){
    width:150px;
    height:150px;
    background:#06b6d4;
    top:60%;
    left:10%;
    animation-delay:4s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-25px);
    }
}

/* Glass Card */
.container{
    width:90%;
    max-width:900px;
    text-align:center;
    padding:60px 40px;
    border-radius:25px;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 8px 32px rgba(0,0,0,0.35);
    
    z-index:10;
}

/* Logo */
.logo{
    font-size:18px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#93c5fd;
    margin-bottom:15px;
}

/* Main Heading */
h1{
    font-size:4rem;
    font-weight:800;
    color:white;
    margin-bottom:20px;
    text-shadow:0 0 20px rgba(255,255,255,0.2);
}

.highlight{
    background:linear-gradient(
        90deg,
        #60a5fa,
        #22d3ee,
        #a78bfa
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* Subtitle */
p{
    color:#dbeafe;
    font-size:1.1rem;
    line-height:1.7;
    max-width:650px;
    margin:auto;
    margin-bottom:35px;
}

/* Buttons */
.btn-group{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:14px 28px;
    border-radius:50px;
    font-weight:600;
    transition:0.3s ease;
}

.primary{
    background:linear-gradient(
        135deg,
        #3b82f6,
        #06b6d4
    );
    color:white;
}

.primary:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(59,130,246,0.5);
}

.secondary{
    border:1px solid rgba(255,255,255,0.25);
    color:white;
    background:rgba(255,255,255,0.05);
}

.secondary:hover{
    background:rgba(255,255,255,0.12);
    transform:translateY(-4px);
}

/* Responsive */
@media(max-width:768px){
    h1{
        font-size:2.5rem;
    }

    p{
        font-size:1rem;
    }

    .container{
        padding:40px 25px;
    }
}
</style>
</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="container">
    <div class="logo">GMI</div>
    <h1>
        Give Me <span class="highlight">Internship</span>
    </h1>

    <p>
        Discover internships, gain real-world experience,
        and kickstart your career journey with opportunities
        tailored for students and aspiring professionals.
    </p>

    <div class="btn-group">
        <a href="#" class="btn primary">Explore Internships</a>
        <a href="#" class="btn secondary">Learn More</a>
    </div>
</div>

</body>
</html>
