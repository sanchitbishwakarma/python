<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ user.name }} | DB Edit</title>
</head>

<body>

        <button type="submit">Edit Now</button>
    </form>
</body>

</html>
